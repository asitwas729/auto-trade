name: Auto Trade (mock)

on:
  # ⚠️ schedule(cron) 트리거는 정시 실행이 보장되지 않음 (인기 시간대 큐 적체로
  #    개장 단타를 놓치는 일이 잦아 제거). 외부 스케줄러(cron-job.org 등)가
  #    GitHub API로 workflow_dispatch를 호출 → 거의 즉시 러너 할당.
  #    오전 세션: 08:20 KST 호출 / 오후 세션: 14:20 KST 호출 (session 입력 구분).
  #    설정 방법은 docs/external-scheduler.md 참고.
  workflow_dispatch:
    inputs:
      session:
        description: '운영 세션 (morning=08:30~10:00 / afternoon=14:30~15:30)'
        required: false
        default: 'morning'
        type: choice
        options:
          - morning
          - afternoon
      log_level:
        description: '로그 레벨 (DEBUG/INFO)'
        required: false
        default: 'INFO'

# 동시 실행 방지 - 같은 KIS 모의계좌에 두 개 동시 가동 시 충돌
concurrency:
  group: auto-trade-mock
  cancel-in-progress: false

jobs:
  trade:
    runs-on: ubuntu-latest
    # 한 세션 최대 1.5h(오전 08:30~10:00). GHA 6h 한도와 무관 — 넉넉히 120분.
    timeout-minutes: 120

    env:
      TZ: Asia/Seoul
      TRADING_MODE: mock
      INITIAL_CAPITAL: '10000000'
      # MARKET_START_TIME / MARKET_END_TIME 은 "Resolve session window" 스텝에서
      # session 입력에 따라 $GITHUB_ENV 로 주입됨.
      LOG_LEVEL: ${{ github.event.inputs.log_level || 'INFO' }}
      # KIS 자격증명
      KIS_MOCK_APP_KEY: ${{ secrets.KIS_MOCK_APP_KEY }}
      KIS_MOCK_APP_SECRET: ${{ secrets.KIS_MOCK_APP_SECRET }}
      KIS_MOCK_ACCOUNT_NO: ${{ secrets.KIS_MOCK_ACCOUNT_NO }}
      KIS_ACCOUNT_PRODUCT: ${{ secrets.KIS_ACCOUNT_PRODUCT }}
      # 알림 (선택)
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      # 뉴스 (S5 전략용)
      NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
      NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
      # 전략 ON/OFF
      STRATEGY_S1_ENABLED: 'true'
      STRATEGY_S2_ENABLED: 'false'
      STRATEGY_S3_ENABLED: 'false'
      STRATEGY_S5_ENABLED: 'true'

    steps:
      - name: Resolve session window
        # session 입력(morning/afternoon) → 운영 구간을 $GITHUB_ENV 로 주입.
        run: |
          case "${{ github.event.inputs.session || 'morning' }}" in
            afternoon)
              echo "MARKET_START_TIME=143000" >> "$GITHUB_ENV"
              echo "MARKET_END_TIME=153500"   >> "$GITHUB_ENV"
              echo "세션=오후 (14:30~15:30)" ;;
            *)
              echo "MARKET_START_TIME=083000" >> "$GITHUB_ENV"
              echo "MARKET_END_TIME=100000"   >> "$GITHUB_ENV"
              echo "세션=오전 (08:30~10:00)" ;;
          esac

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore data cache (sector leaders, token, ohlcv archive)
        uses: actions/cache@v4
        with:
          path: |
            data/sector_leaders_cache.json
            data/.kis_token_mock.json
            data/day_start_eval.json
            data/ohlcv/
          key: auto-trade-data-${{ github.run_id }}
          restore-keys: |
            auto-trade-data-

      - name: Holiday gate (KRX 거래일 확인)
        id: gate
        continue-on-error: true
        run: python scripts/should_run_today.py

      - name: Skip notice (휴장일/주말)
        if: steps.gate.outcome != 'success'
        run: |
          echo "오늘은 KRX 거래일이 아니므로 매매를 건너뜁니다."

      - name: Run AutoTrader
        if: steps.gate.outcome == 'success'
        # MARKET_END_TIME(오전 10:00 / 오후 15:35)에 main.py가 리포트 발송 후
        # 정상 종료. 비정상 행(hang) 방지용 상한으로 110분.
        timeout-minutes: 110
        run: python main.py

      - name: Fetch backtest minute data (after session)
        # main.py 정상 종료 후 실행 (운영 세션 구간 분봉 수집).
        # 고정 20종목 + 동적 top 5 = 25종목 × 14 calls × 1.2s ≈ 7분.
        if: steps.gate.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 15
        run: python scripts/fetch_daily_backtest_data.py

      - name: Save data cache (always)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            data/sector_leaders_cache.json
            data/.kis_token_mock.json
            data/day_start_eval.json
            data/ohlcv/
          key: auto-trade-data-${{ github.run_id }}

      - name: Upload logs (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auto-trade-logs-${{ github.run_id }}
          path: |
            logs/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload backtest data (always, for local download)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backtest-ohlcv-${{ github.run_id }}
          path: |
            data/ohlcv/
          retention-days: 30
          if-no-files-found: ignore
